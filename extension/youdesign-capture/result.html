<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>YouDesign Capture</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        color: #1f2937;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
      }
      main {
        max-width: 680px;
        margin: 10vh auto 0;
        padding: 24px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      .message {
        margin: 0 0 18px;
        white-space: pre-wrap;
      }
      .hint {
        margin: 0;
        color: #6b7280;
        font-size: 13px;
      }
      button {
        height: 34px;
        margin-top: 18px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: #1677ff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">导入失败</h1>
      <p id="message" class="message"></p>
      <p id="hint" class="hint"></p>
      <button id="close" type="button">关闭</button>
    </main>
    <script src="result.js"></script>
  </body>
</html>
